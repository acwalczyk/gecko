description: Cluster is the Schema for the clusters API
properties:
  apiVersion:
    description: |-
      APIVersion defines the versioned schema of this representation of an object.
      Servers should convert recognized schemas to the latest internal value, and
      may reject unrecognized values.
      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
    type: string
  kind:
    description: |-
      Kind is a string value representing the REST resource this object represents.
      Servers may infer this from the endpoint the client submits requests to.
      Cannot be updated.
      In CamelCase.
      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
    type: string
  metadata:
    type: object
  spec:
    description: spec defines the desired state of Cluster
    properties:
      dns:
        description: dns defines the DNS configuration for the cluster.
        properties:
          baseDomain:
            description: baseDomain is the base DNS domain for the cluster.
            type: string
        required:
        - baseDomain
        type: object
      infraID:
        description: infraID is the unique infrastructure identifier for this cluster.
        type: string
      issuerURL:
        description: issuerURL is the OIDC issuer URL for the cluster.
        type: string
      networking:
        description: networking defines the networking configuration for the cluster.
        properties:
          clusterNetwork:
            description: clusterNetwork is the list of IP address pools for pod IPs.
            items:
              description: NetworkRange defines a network CIDR range.
              properties:
                cidr:
                  description: cidr is the IP address range in CIDR notation.
                  type: string
              required:
              - cidr
              type: object
            type: array
          networkType:
            description: networkType is the CNI plugin type (e.g. "OVNKubernetes").
            type: string
          serviceNetwork:
            description: serviceNetwork is the list of IP address pools for service
              IPs.
            items:
              description: NetworkRange defines a network CIDR range.
              properties:
                cidr:
                  description: cidr is the IP address range in CIDR notation.
                  type: string
              required:
              - cidr
              type: object
            type: array
        type: object
      platform:
        description: platform specifies the underlying infrastructure provider configuration.
        properties:
          type:
            description: type is the infrastructure provider type (e.g. "GCP", "AWS").
            type: string
        required:
        - type
        type: object
      release:
        description: release specifies the target release for the cluster.
        properties:
          image:
            description: image is the release image pullspec.
            type: string
        required:
        - image
        type: object
    required:
    - infraID
    - platform
    - release
    type: object
  status:
    description: status defines the observed state of Cluster
    properties:
      conditions:
        description: conditions represent the latest available observations of a cluster's
          current state.
        items:
          description: Condition contains details for one aspect of the current state
            of this API Resource.
          properties:
            lastTransitionTime:
              description: |-
                lastTransitionTime is the last time the condition transitioned from one status to another.
                This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
              format: date-time
              type: string
            message:
              description: |-
                message is a human readable message indicating details about the transition.
                This may be an empty string.
              maxLength: 32768
              type: string
            observedGeneration:
              description: |-
                observedGeneration represents the .metadata.generation that the condition was set based upon.
                For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                with respect to the current state of the instance.
              format: int64
              minimum: 0
              type: integer
            reason:
              description: |-
                reason contains a programmatic identifier indicating the reason for the condition's last transition.
                Producers of specific condition types may define expected values and meanings for this field,
                and whether the values are considered a guaranteed API.
                The value should be a CamelCase string.
                This field may not be empty.
              maxLength: 1024
              minLength: 1
              pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
              type: string
            status:
              description: status of the condition, one of True, False, Unknown.
              enum:
              - "True"
              - "False"
              - Unknown
              type: string
            type:
              description: type of condition in CamelCase or in foo.example.com/CamelCase.
              maxLength: 316
              pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
              type: string
          required:
          - lastTransitionTime
          - message
          - reason
          - status
          - type
          type: object
        type: array
      hostedClusterResult:
        description: hostedClusterResult holds the result of the hosted cluster provisioning.
        properties:
          kubeconfig:
            description: kubeconfig is the kubeconfig for accessing the hosted cluster.
            type: string
        type: object
      placementResult:
        description: placementResult holds the result of the placement decision.
        properties:
          managementCluster:
            description: managementCluster is the name of the management cluster where
              this cluster is placed.
            type: string
        type: object
      versionResolution:
        description: versionResolution holds the resolved version information.
        properties:
          resolvedImage:
            description: resolvedImage is the fully-resolved release image pullspec.
            type: string
          resolvedVersion:
            description: resolvedVersion is the resolved OCP version string.
            type: string
        type: object
    type: object
required:
- spec
type: object
