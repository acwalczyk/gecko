description: NodePool is the Schema for the nodepools API
properties:
  apiVersion:
    description: |-
      APIVersion defines the versioned schema of this representation of an object.
      Servers should convert recognized schemas to the latest internal value, and
      may reject unrecognized values.
      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
    type: string
  kind:
    description: |-
      Kind is a string value representing the REST resource this object represents.
      Servers may infer this from the endpoint the client submits requests to.
      Cannot be updated.
      In CamelCase.
      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
    type: string
  metadata:
    type: object
  spec:
    description: spec defines the desired state of NodePool
    properties:
      autoscaling:
        description: autoscaling defines autoscaling configuration for the node pool.
        properties:
          max:
            description: max is the maximum number of nodes.
            format: int32
            type: integer
          min:
            description: min is the minimum number of nodes.
            format: int32
            type: integer
        required:
        - max
        - min
        type: object
      clusterID:
        description: clusterID is the ID of the parent cluster this node pool belongs
          to.
        type: string
      nodeCount:
        description: nodeCount is the desired number of nodes. Mutually exclusive
          with autoscaling.
        format: int32
        type: integer
      nodeLabels:
        additionalProperties:
          type: string
        description: nodeLabels are labels applied to all nodes in the pool.
        type: object
      platform:
        description: platform specifies the infrastructure provider configuration
          for nodes.
        properties:
          gcp:
            description: gcp is the GCP-specific configuration. Required when type
              is "GCP".
            properties:
              instanceType:
                description: instanceType is the GCP machine type (e.g. "n2-standard-4").
                type: string
            required:
            - instanceType
            type: object
          type:
            description: type is the infrastructure provider type (e.g. "GCP", "AWS").
            type: string
        required:
        - type
        type: object
      release:
        description: release specifies the target release for the node pool.
        properties:
          image:
            description: image is the release image pullspec.
            type: string
        required:
        - image
        type: object
      taints:
        description: taints are taints applied to all nodes in the pool.
        items:
          description: Taint defines a Kubernetes taint.
          properties:
            effect:
              description: effect is the taint effect (NoSchedule, PreferNoSchedule,
                NoExecute).
              type: string
            key:
              description: key is the taint key.
              type: string
            value:
              description: value is the taint value.
              type: string
          required:
          - effect
          - key
          type: object
        type: array
    required:
    - clusterID
    - platform
    - release
    type: object
  status:
    description: status defines the observed state of NodePool
    properties:
      conditions:
        description: conditions represent the latest available observations of a node
          pool's current state.
        items:
          description: Condition contains details for one aspect of the current state
            of this API Resource.
          properties:
            lastTransitionTime:
              description: |-
                lastTransitionTime is the last time the condition transitioned from one status to another.
                This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
              format: date-time
              type: string
            message:
              description: |-
                message is a human readable message indicating details about the transition.
                This may be an empty string.
              maxLength: 32768
              type: string
            observedGeneration:
              description: |-
                observedGeneration represents the .metadata.generation that the condition was set based upon.
                For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                with respect to the current state of the instance.
              format: int64
              minimum: 0
              type: integer
            reason:
              description: |-
                reason contains a programmatic identifier indicating the reason for the condition's last transition.
                Producers of specific condition types may define expected values and meanings for this field,
                and whether the values are considered a guaranteed API.
                The value should be a CamelCase string.
                This field may not be empty.
              maxLength: 1024
              minLength: 1
              pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
              type: string
            status:
              description: status of the condition, one of True, False, Unknown.
              enum:
              - "True"
              - "False"
              - Unknown
              type: string
            type:
              description: type of condition in CamelCase or in foo.example.com/CamelCase.
              maxLength: 316
              pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
              type: string
          required:
          - lastTransitionTime
          - message
          - reason
          - status
          - type
          type: object
        type: array
      versionResolution:
        description: versionResolution holds the resolved version information.
        properties:
          resolvedImage:
            description: resolvedImage is the fully-resolved release image pullspec.
            type: string
          resolvedVersion:
            description: resolvedVersion is the resolved OCP version string.
            type: string
        type: object
    type: object
required:
- spec
type: object
