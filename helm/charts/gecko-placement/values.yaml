replicaCount: 1

image:
  registry: CHANGE_ME
  repository: CHANGE_ME
  tag: ""
  pullPolicy: Always

nameOverride: ""
fullnameOverride: ""

orlopURL: ""
logLevel: info
logFormat: json
workers: 10

maestro:
  httpAddr: "http://maestro.hyperfleet.svc.cluster.local:8000"

# Static list of management cluster names. Ignored when secretManagerProject is set.
candidates: []
# Base domains paired with candidates (one per MC).
baseDomains: []
# GCP project for Secret Manager MC/DNS discovery. Enables dynamic selector.
# Can also be set at runtime via the SECRETMANAGER_PROJECT env var, but must
# be non-empty here (or candidates must be set) to pass Helm validation.
secretManagerProject: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

rbac:
  create: false

strategy:
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
  type: RollingUpdate

podSecurityContext:
  fsGroup: 65532
  runAsNonRoot: true
  runAsUser: 65532

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  seccompProfile:
    type: RuntimeDefault

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}

podAnnotations: {}
podLabels: {}
imagePullSecrets: []
