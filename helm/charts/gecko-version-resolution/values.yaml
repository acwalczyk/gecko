replicaCount: 1

image:
  registry: CHANGE_ME
  repository: CHANGE_ME
  tag: ""
  pullPolicy: Always

nameOverride: ""
fullnameOverride: ""

orlopURL: ""
logLevel: info
logFormat: json
workers: 10

cincinnati:
  url: "https://api.openshift.com/api/upgrades_info/v1/graph"
  arch: amd64

serviceAccount:
  create: true
  annotations: {}
  name: ""

rbac:
  create: false

podSecurityContext:
  fsGroup: 65532
  runAsNonRoot: true
  runAsUser: 65532

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  seccompProfile:
    type: RuntimeDefault

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}

podAnnotations: {}
podLabels: {}
imagePullSecrets: []
