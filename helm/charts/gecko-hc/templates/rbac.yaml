{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "gecko-hc.fullname" . }}
  labels:
    {{- include "gecko-hc.labels" . | nindent 4 }}
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "gecko-hc.fullname" . }}
  labels:
    {{- include "gecko-hc.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "gecko-hc.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "gecko-hc.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
