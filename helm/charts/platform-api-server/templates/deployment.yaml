{{- include "platform-api-server.validateValues" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform-api-server.fullname" . }}
  labels:
    {{- include "platform-api-server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "platform-api-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "platform-api-server.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "platform-api-server.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --address=0.0.0.0
            - --private-port={{ .Values.tls.port }}
            - --tls-cert-file=/etc/tls/tls.crt
            - --tls-key-file=/etc/tls/tls.key
            - --public-port={{ .Values.publicApi.port }}
            - --enable-public-api={{ .Values.publicApi.enabled }}
            {{- if .Values.corsOrigins }}
            - --cors-origins={{ join "," .Values.corsOrigins }}
            {{- end }}
          {{- if .Values.alloydb.enabled }}
          env:
            - name: DB_HOST
              value: {{ required "alloydb.host is required when alloydb is enabled (set after AlloyDB instance is provisioned)" .Values.alloydb.host | quote }}
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: {{ .Values.alloydb.database | quote }}
            - name: DB_USER
              value: {{ .Values.alloydb.auth.username | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-db" (include "platform-api-server.fullname" .)) .Values.alloydb.auth.existingSecret }}
                  key: password
            - name: DB_SSLMODE
              value: {{ .Values.alloydb.sslMode | quote }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.tls.port }}
              name: https
              protocol: TCP
            {{- if .Values.publicApi.enabled }}
            - containerPort: {{ .Values.publicApi.port }}
              name: public-api
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /livez
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tls
              mountPath: /etc/tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: {{ include "platform-api-server.fullname" . }}-tls
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
