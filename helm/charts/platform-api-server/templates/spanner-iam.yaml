{{- if and .Values.spanner.enabled .Values.spanner.iam.serviceAccount }}
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMPolicyMember
metadata:
  name: {{ printf "%s-spanner-user" (include "platform-api-server.fullname" .) }}
  annotations:
    cnrm.cloud.google.com/project-id: {{ required "spanner.projectId is required when spanner is enabled" .Values.spanner.projectId | quote }}
  labels:
    {{- include "platform-api-server.labels" . | nindent 4 }}
spec:
  # Workload Identity: the GCP service account bound to the pod's Kubernetes
  # service account authenticates against Spanner using the granted role.
  member: {{ printf "serviceAccount:%s" .Values.spanner.iam.serviceAccount }}
  role: {{ .Values.spanner.iam.role }}
  resourceRef:
    kind: SpannerDatabase
    name: {{ .Values.spanner.databaseId }}
{{- end }}
