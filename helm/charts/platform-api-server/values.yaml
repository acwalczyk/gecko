replicaCount: 1

image:
  registry: CHANGE_ME
  repository: CHANGE_ME
  tag: ""
  pullPolicy: Always

nameOverride: ""
fullnameOverride: ""

apiService:
  group: gcp.managed.openshift.io
  version: v1
  groupPriorityMinimum: 1000
  versionPriority: 15

tls:
  port: 8443
  certManager:
    enabled: true
    issuerRef:
      name: selfsigned
      kind: ClusterIssuer

publicApi:
  enabled: true
  port: 8081

corsOrigins: []

serviceAccount:
  create: true
  annotations: {}
  name: ""

podSecurityContext:
  fsGroup: 65532
  runAsNonRoot: true
  runAsUser: 65532

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  seccompProfile:
    type: RuntimeDefault

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

strategy:
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
  type: RollingUpdate

podDisruptionBudget:
  enabled: true
  minAvailable: 1

revisionHistoryLimit: 10
terminationGracePeriodSeconds: 30

nodeSelector: {}
tolerations: []
affinity: {}

podAnnotations: {}
podLabels: {}
imagePullSecrets: []

alloydb:
  enabled: false
  projectId: ""
  location: "us-central1"
  host: ""
  networkRef: "default"
  databaseVersion: "POSTGRES_15"
  cpuCount: 2
  auth:
    username: "orlop"
    password: ""
    existingSecret: ""
  database: "orlop"
  sslMode: "require"
